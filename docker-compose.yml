# Kiseki local development stack.
#
# Usage:
#   docker compose up --build              — dev stack
#   docker compose up --build -d && pytest — e2e tests
#
# The server creates a bootstrap shard for e2e testing by default.
# Includes: Jaeger (tracing), Vault (KMS), Keycloak (OIDC).

services:
  kiseki-server:
    # Pin a stable tag so `docker compose up -d` reuses an image
    # built out-of-band (`docker build -t kiseki-server:local .`)
    # instead of rebuilding each invocation under the auto-generated
    # `kiseki-kiseki-server` name.
    image: kiseki-server:local
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "2049:2049"  # NFS (v3 + v4.2)
      - "9000:9000"  # S3 HTTP gateway
      - "9090:9090"  # Prometheus metrics
      - "9100:9100"  # data-path gRPC
      - "9101:9101"  # advisory gRPC
    environment:
      KISEKI_DATA_ADDR: "0.0.0.0:9100"
      KISEKI_ADVISORY_ADDR: "0.0.0.0:9101"
      KISEKI_S3_ADDR: "0.0.0.0:9000"
      KISEKI_NFS_ADDR: "0.0.0.0:2049"
      KISEKI_METRICS_ADDR: "0.0.0.0:9090"
      KISEKI_DATA_DIR: "/data"
      KISEKI_BOOTSTRAP: "true"
      # Dev/test compose has no Cluster CA bundle. ADR-038 §D4.2
      # plaintext-NFS fallback is the documented dev path: emits a
      # SecurityDowngradeEnabled audit event each boot, halves the
      # layout TTL to 60s, refuses to start with > 1 tenant on the
      # listener. Production deployments wire real certs and drop
      # both flags.
      KISEKI_ALLOW_PLAINTEXT_NFS: "true"
      KISEKI_INSECURE_NFS: "true"
      # Dev/test compose has no SSO front-door. The admin web RBAC
      # added in feat/admin-rbac-auth defaults ON in production; here
      # we explicitly opt out so e2e tests can scrape /cluster/info,
      # /admin/* and /ui/* without a token. Production deployments
      # leave both unset and set KISEKI_ADMIN_TOKEN /
      # KISEKI_CLIENT_TOKEN. See `docs/admin/dashboard.md`.
      KISEKI_ADMIN_AUTH_DISABLED: "true"
      KISEKI_CLUSTER_INFO_PUBLIC: "true"
      # F-1 (2026-05-15): buffer composition-store writes + drive a
      # periodic 100ms fsync instead of fsync-per-write. Without this
      # the hydrator's apply_hydration_batch path hits the disk-fsync
      # ceiling under sustained NFS write load (~50 ops/sec on GCP
      # local-SSD; in-memory baseline showed 167k/sec, so the math is
      # fine). Safe at dev/test scope: single-node compose has no
      # cross-node replication, so a hard crash within 100ms of a
      # write loses that write — acceptable for e2e tests.
      KISEKI_COMPOSITION_FLUSH_INTERVAL_MS: "100"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "kiseki-server"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
    volumes:
      - kiseki-data:/data
    depends_on:
      jaeger:
        condition: service_started
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/9100' 2>/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "16686:16686" # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  vault:
    image: hashicorp/vault:1.19
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "kiseki-e2e-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev"]
    # Keycloak 26 `start-dev` does NOT expose `/health/ready` —
    # that endpoint only lives in the production `start` mode behind
    # `--health-enabled=true` on the management port (9000), which
    # dev-mode doesn't bind. Probe the OIDC well-known endpoint
    # instead: 200 + `"issuer"` in the body means Keycloak is fully
    # booted (realm loaded, HTTP listener accepting REST calls).
    # `Connection: close` keeps each probe self-contained.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | grep -q '\"issuer\"'"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kiseki-data:
