name: BDD Acceptance

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "examples/**"
      - "*.md"
      - "infra/**"
  workflow_dispatch:
  schedule:
    # Nightly full BDD run at 03:00 UTC. Catches drift in
    # @slow / @integration scenarios that the push-time fast lane
    # skips.
    - cron: "0 3 * * *"

concurrency:
  group: bdd-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# BDD lives outside `ci.yml` because every multi-node scenario
# spawns 3-20 `kiseki-server` children, and the kiseki-server
# release build is the long pole — neither fits the ≤2 min CI
# merge-blocking budget.
#
# Two jobs:
#   - `smoke` (push + workflow_dispatch): KISEKI_BDD_FAST=1 +
#     `slow-tests` feature OFF → skips @slow and skips
#     @integration scenarios that aren't @smoke. Runs ~5 curated
#     multi-node @smoke scenarios + the ~200 @library scenarios
#     in 3-5 min. Catches the obvious cross-cutting regressions.
#   - `full` (nightly + workflow_dispatch): no env var, no
#     filtering → all 316 scenarios in 8-12 min.
#
# Failures are reported but don't gate merges (intentionally —
# the design tradeoff in the CI revamp). Catch + revert
# workflow: a regression on main triggers a Slack/email alert
# (separate workflow, out of scope here) and the author
# auto-reverts via `git revert`.

jobs:
  smoke:
    name: BDD Smoke (KISEKI_BDD_FAST=1)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Build kiseki-server for ClusterHarness scenarios
        # Debug build instead of release — saves ~3 min vs the
        # previous CI's release build, costs ~30% runtime per
        # scenario which is fine for the smoke set (~5 multi-node
        # scenarios, ~30s total runtime).
        run: cargo build --locked -p kiseki-server
      - name: Run BDD smoke + @library suite
        env:
          # Filter @slow + non-smoke @integration scenarios.
          # The full suite (no env var) runs in the `full` job
          # below on nightly schedule.
          KISEKI_BDD_FAST: "1"
        run: |
          output=$(cargo test -p kiseki-acceptance --locked 2>&1)
          echo "$output" | tail -10
          if echo "$output" | grep -qE "[1-9][0-9]* failed"; then
            echo "::error::BDD smoke scenarios failed"
            echo "$output" | grep -E "[1-9][0-9]* failed"
            echo "::group::Failed scenarios"
            echo "$output" | grep -B 4 -A 2 "Step failed:" || true
            echo "::endgroup::"
            exit 1
          fi

  full:
    name: BDD Full Suite (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Build kiseki-server (release for full-suite scenarios)
        # Release build for the nightly path — full @slow +
        # @integration coverage benefits from optimized binaries
        # (Raft elections settle within their 150-300 ms windows).
        run: cargo build --locked --release -p kiseki-server
      - name: Run full BDD suite (no fast-lane filter, slow-tests on)
        run: |
          output=$(cargo test -p kiseki-acceptance --features slow-tests --locked 2>&1)
          echo "$output" | tail -10
          if echo "$output" | grep -qE "[1-9][0-9]* failed"; then
            echo "::error::BDD full suite scenarios failed"
            echo "$output" | grep -E "[1-9][0-9]* failed"
            echo "::group::Failed scenarios"
            echo "$output" | grep -B 4 -A 2 "Step failed:" || true
            echo "::endgroup::"
            exit 1
          fi
