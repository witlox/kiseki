name: Slow Tier (slow unit + full BDD)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "examples/**"
      - "*.md"
      - "infra/**"
  workflow_dispatch:

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# **Tier 2 (slow)** — Makefile target: `make test-slow`.
#
# Tier 2 = Tier 1 (fast unit + BDD smoke) + the slow-marked unit
# tests + the rest of the BDD suite. CI runs this on push-to-main +
# nightly + dispatch, advisory only (does NOT block merges — Tier 1
# in `ci.yml` is the merge-blocking gate).
#
# Why two jobs:
#   - `slow-unit` runs `cargo nextest run --run-ignored=only` which
#     picks up only the `#[ignore = "slow:…"]` tests Tier 1 skipped.
#   - `slow-bdd` runs the full BDD suite (no `KISEKI_BDD_FAST`
#     env var → no @smoke / @slow filtering). Release-grade
#     kiseki-server build because the @slow Raft scenarios
#     legitimately need optimized binaries to settle within the
#     150-300 ms election windows.
#
# Failures here are reported but do NOT gate merges. A regression
# on main triggers an alert (separate workflow, out of scope) and
# the author auto-reverts via `git revert`.

jobs:
  slow-unit:
    name: Slow-marked unit tests (run-ignored=only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: ./.github/actions/install-deps
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # `slow` profile + --run-ignored=only → only the
      # `#[ignore = "slow:…"]` unit tests. kiseki-acceptance excluded
      # via the profile's default-filter. Two invocations to dodge
      # the kiseki-chunk-cluster rustls conflict, same as ci.yml.
      # `--no-tests=warn` because nextest 0.9.x defaults to exit 4
      # when no tests match the filter, and that's the natural state
      # while the workspace has zero `#[ignore = "slow:…"]` tests.
      # `-E 'not test(measure_)'` — `measure_*` is the manual
      # perf-probe naming convention; probes never run in a CI lane.
      - run: cargo nextest run --profile slow --run-ignored=only --no-tests=warn -E 'not test(measure_)' --workspace --exclude kiseki-acceptance --exclude kiseki-chunk-cluster --locked
      - run: cargo nextest run --profile slow --run-ignored=only --no-tests=warn -p kiseki-chunk-cluster --locked

  slow-bdd:
    name: Full BDD suite (no @smoke filter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: ./.github/actions/install-deps
      - uses: Swatinem/rust-cache@v2
      - name: Build kiseki-server (release — needed for @slow Raft scenarios)
        run: cargo build --locked --release -p kiseki-server
      - name: Run full BDD suite (slow-tests feature on)
        # No `KISEKI_BDD_FAST` env var → cucumber runner picks up
        # @slow + @integration scenarios. `--features slow-tests`
        # toggles a runtime branch that includes Raft-cluster
        # scenarios skipped on macOS by default.
        # `cargo test` not `nextest run` — same rationale as
        # ci.yml's BDD @smoke step: cucumber is `harness = false`
        # and rejects nextest's `--list --format terse` libtest
        # probe via cucumber-rs's clap CLI parser.
        run: cargo test --locked --features kiseki-acceptance/slow-tests -p kiseki-acceptance --test acceptance --release
