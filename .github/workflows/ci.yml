name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "examples/**"
      - "*.md"
      - "infra/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "examples/**"
      - "*.md"
      - "infra/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Merge-blocking lane = Makefile **Tier 1 (fast)**.
#
#   Stage 1 (parallel, no deps):  fmt, clippy, deny, proto-coverage,
#                                 arch-check.
#   Stage 2 (depends on Stage 1): unit-tests-fast, bdd-smoke.
#
# Tier 1 = fast unit tests + BDD `@smoke` scenarios. Slow-marked unit
# tests (`#[ignore = "slow:…"]`) and the rest of the BDD suite live
# in `bdd.yml` (Tier 2 — push-to-main + nightly). Python e2e + the
# release-grade lanes live in `release.yml` (Tier 3 — weekly +
# workflow_dispatch).
#
# Why BDD smoke is in CI now (a change from prior runs that had it
# in `bdd.yml`): the three-tier model commits Tier 1 to "unit + BDD
# smoke" so PRs catch cross-context regressions before merge. The
# kiseki-server build is the long pole; we use the debug build to
# keep total CI wall under a few minutes.

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — fast checks, gate everything (run in parallel)
  # ---------------------------------------------------------------------------

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  proto-coverage:
    name: Proto Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check every .proto is in build.rs
        run: |
          set -euo pipefail
          miss=0
          for f in specs/architecture/proto/kiseki/v1/*.proto; do
            name="kiseki/v1/$(basename "$f")"
            if ! grep -q "\"$name\"" crates/kiseki-proto/build.rs; then
              echo "::error file=$f::proto file not listed in crates/kiseki-proto/build.rs"
              miss=1
            fi
          done
          exit $miss

  arch-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify kiseki-control dependency boundary (ADR-027)
        run: |
          set -euo pipefail
          # ADR-027: kiseki-control depends ONLY on kiseki-common,
          # kiseki-proto, and observability shims (kiseki-tracing).
          # No data-path crates (log/chunk/composition/view/gateway/
          # client/keymanager/crypto/raft/transport/audit/advisory).
          deps=$(grep '^kiseki-' crates/kiseki-control/Cargo.toml \
            | grep -v 'kiseki-common\|kiseki-proto\|kiseki-tracing' \
            | grep -v '^#' || true)
          if [ -n "$deps" ]; then
            echo "::error::kiseki-control has forbidden dependencies: $deps"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Stage 2 — Tier 1 fast tests (depend on Stage 1)
  # ---------------------------------------------------------------------------

  unit-tests-fast:
    name: Unit Tests (Tier 1 fast)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # `fast` profile excludes kiseki-acceptance + skips
      # `#[ignore = "slow:…"]` tests. Two invocations because the
      # kiseki-chunk-cluster gRPC + TLS tests hang under workspace-
      # parallel load (process-wide rustls CryptoProvider conflict).
      - run: cargo nextest run --profile fast --workspace --exclude kiseki-acceptance --exclude kiseki-chunk-cluster --locked
      - run: cargo nextest run --profile fast -p kiseki-chunk-cluster --locked

  bdd-smoke:
    name: BDD @smoke (Tier 1 fast)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Build kiseki-server (debug — saves ~3 min vs release)
        run: cargo build --locked -p kiseki-server
      - name: Run BDD @smoke
        env:
          # Cucumber runner branch in `acceptance.rs`: skip @slow,
          # skip non-smoke @integration. The remaining ~5 multi-node
          # @smoke + ~200 @library scenarios run in 3-5 min.
          KISEKI_BDD_FAST: "1"
        # `cargo test` not `nextest run`: the cucumber binary is
        # `harness = false`, so nextest's libtest-style enumeration
        # (`--list --format terse`) fails on cucumber-rs's clap
        # parser. cargo test invokes the binary directly with no
        # libtest pre-flight, which is what cucumber expects.
        run: cargo test --locked -p kiseki-acceptance --test acceptance
