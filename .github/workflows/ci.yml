name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "examples/**"
      - "*.md"
      - "infra/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "examples/**"
      - "*.md"
      - "infra/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Merge-blocking lane only — target ≤2 min warm.
#
# Stage 1 (parallel): fmt, clippy, deny.
# Stage 2 (after stage 1, parallel): unit tests, chunk-cluster
#   tests, proto coverage, arch check.
#
# BDD acceptance is OUT of this workflow — every multi-node
# scenario spawns 3-20 `kiseki-server` children, the harness boot
# alone runs ~5-30 s per cluster size, and the kiseki-server
# release build is the long pole. BDD now lives in `bdd.yml`,
# which runs on push-to-main + workflow_dispatch + nightly so
# multi-node coverage stays present without blocking PR merge.
#
# The 14-job feature-flag compilation matrix lives in
# `feature-matrix.yml` — paths-filtered (Cargo.toml / build.rs)
# + nightly + workflow_dispatch + run-on-release.
#
# Coverage + e2e + slow BDD live in `release.yml` (weekly +
# workflow_dispatch).

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — fast checks, gate everything
  # ---------------------------------------------------------------------------

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ---------------------------------------------------------------------------
  # Stage 2 — test suites (needs stage 1, all parallel)
  # ---------------------------------------------------------------------------

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Two invocations because the kiseki-chunk-cluster gRPC + TLS
      # tests hang under any workspace-parallel load (process-wide
      # rustls CryptoProvider conflict with other tests' tonic
      # clients). Running them in a separate nextest process gives
      # them a fresh `rustls::crypto` install and they pass in 80 ms.
      - run: cargo nextest run --workspace --exclude kiseki-acceptance --exclude kiseki-chunk-cluster --locked --profile ci
      - run: cargo nextest run -p kiseki-chunk-cluster --locked --profile ci

  # BDD acceptance moved out of CI — see `bdd.yml`. Runs on push-to-
  # main + workflow_dispatch + nightly so multi-node coverage stays
  # present without blocking PR merge on the kiseki-server build.
  #
  # E2E moved to release.yml — runs on workflow_dispatch / weekly
  # schedule and gates `publish`. CI keeps fast-feedback only.

  proto-coverage:
    name: Proto Coverage
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v6
      - name: Check every .proto is in build.rs
        run: |
          set -euo pipefail
          miss=0
          for f in specs/architecture/proto/kiseki/v1/*.proto; do
            name="kiseki/v1/$(basename "$f")"
            if ! grep -q "\"$name\"" crates/kiseki-proto/build.rs; then
              echo "::error file=$f::proto file not listed in crates/kiseki-proto/build.rs"
              miss=1
            fi
          done
          exit $miss

  arch-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v6
      - name: Verify kiseki-control dependency boundary (ADR-027)
        run: |
          set -euo pipefail
          # ADR-027: kiseki-control depends ONLY on kiseki-common,
          # kiseki-proto, and observability shims (kiseki-tracing).
          # No data-path crates (log/chunk/composition/view/gateway/
          # client/keymanager/crypto/raft/transport/audit/advisory).
          deps=$(grep '^kiseki-' crates/kiseki-control/Cargo.toml \
            | grep -v 'kiseki-common\|kiseki-proto\|kiseki-tracing' \
            | grep -v '^#' || true)
          if [ -n "$deps" ]; then
            echo "::error::kiseki-control has forbidden dependencies: $deps"
            exit 1
          fi

  # Coverage moved to release.yml (weekly + workflow_dispatch) —
  # the codecov upload is a trend signal, not a merge gate, and
  # adding ~4 min to every push isn't worth the spend.
