[package]
name = "kiseki-log"
description = "Log context for Kiseki: delta ordering, Raft replication, shard lifecycle, compaction, GC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate; only kiseki-client publishes (release.yml)

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
kiseki-common = { workspace = true }
kiseki-proto = { workspace = true }
kiseki-raft = { workspace = true }
kiseki-tracing = { workspace = true }
futures = "0.3"
# fjall WAL for the ADR-047 durable IntentStore (phase 2). Same
# version kiseki-chunk pins for its ADR-022 rev-4 meta store.
fjall = "3.1"
openraft = { workspace = true }
# Encode the built append into the durable intent value (ADR-047).
prost = { workspace = true }
# Postcard frames the ADR-047 IntentSync aux-tag RPC payloads on the
# multiplexed Raft transport (same wire codec kiseki-raft uses).
postcard = { workspace = true }
prometheus = { workspace = true }
# Optional mTLS client config carried by the ADR-047 TransportIntentGatherer
# (mirrors the Raft network's mTLS seam; plaintext/None in dev today).
rustls = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Persistent log files for `RaftTestCluster` (Phase 14f) — tempdir
# survives the cluster lifetime so `restart_node()` can reopen.
tempfile = "3"

[dev-dependencies]
kiseki-control = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
