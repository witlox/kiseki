[package]
name = "kiseki-composition"
description = "Composition context for Kiseki: file/object metadata, namespaces, multipart, versioning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate; only kiseki-client publishes (release.yml)

[lints]
workspace = true

[features]
default = []
# ADR-047 escalation — fine-grained per-step write-path timers.
# Propagates `kiseki-tracing/hot-path-trace`. OFF by default (zero
# runtime cost; macros expand to `()`).
hot-path-trace = ["kiseki-tracing/hot-path-trace"]

[dependencies]
async-trait = { workspace = true }
kiseki-common = { workspace = true }
kiseki-log = { workspace = true }
# Used for the ADR-047 `hot_timer!` / `hot_span!` macros in the
# hydrator hot path. The crate is a hard dep (so the macros resolve
# even with `hot-path-trace` off, where they expand to `()`); the
# heavy prometheus dep inside kiseki-tracing is itself feature-gated.
kiseki-tracing = { workspace = true }
thiserror = { workspace = true }
# tokio is needed at lib level for the hydrator's async poll + the
# Arc<tokio::sync::Mutex<CompositionStore>> handle shared with the gateway.
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Persistent CompositionStore (ADR-022 successor): fjall replaces
# redb on the write-heavy hot path 2026-05-06 — redb's B-tree
# commit cost capped persistent PUT at ~18 k op/s on the perf
# harness, fjall's LSM (memtable + WAL on the write side, background
# compaction off the hot path) is the migration target ADR-022
# already names in its "Consequences". Postcard handles the
# `Composition` value-bytes encoding; the encoding module
# (`persistent/encoding.rs`) is the single source of truth for the
# wire format so a future backend swap doesn't re-serialize rows.
fjall = "3.1"
postcard = { workspace = true }
parking_lot = { workspace = true }
# ADR-042 §post-V3 perf: composition LRU on top of the storage Mutex
# so the GET hot path skips fjall lookup on cache hit (14.74% of CPU
# at 64 KiB GET pre-fix).
lru = { workspace = true }
serde = { version = "1", features = ["derive"] }
# §D10 observability — exposes hydrator + persistent-store counters /
# gauges / histograms via the same `prometheus::Registry` the rest of
# kiseki-server uses.
prometheus = { workspace = true }

[dev-dependencies]
kiseki-view = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
