[package]
name = "kiseki-composition"
description = "Composition context for Kiseki: file/object metadata, namespaces, multipart, versioning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
kiseki-common = { workspace = true }
kiseki-log = { workspace = true }
thiserror = { workspace = true }
# tokio is needed at lib level for the hydrator's async poll + the
# Arc<tokio::sync::Mutex<CompositionStore>> handle shared with the gateway.
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Persistent CompositionStore (ADR-022 successor): fjall replaces
# redb on the write-heavy hot path 2026-05-06 — redb's B-tree
# commit cost capped persistent PUT at ~18 k op/s on the perf
# harness, fjall's LSM (memtable + WAL on the write side, background
# compaction off the hot path) is the migration target ADR-022
# already names in its "Consequences". Postcard handles the
# `Composition` value-bytes encoding; the encoding module
# (`persistent/encoding.rs`) is the single source of truth for the
# wire format so a future backend swap doesn't re-serialize rows.
fjall = "3.1"
postcard = { workspace = true }
parking_lot = { workspace = true }
serde = { version = "1", features = ["derive"] }
# §D10 observability — exposes hydrator + persistent-store counters /
# gauges / histograms via the same `prometheus::Registry` the rest of
# kiseki-server uses.
prometheus = { workspace = true }

[dev-dependencies]
kiseki-view = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
