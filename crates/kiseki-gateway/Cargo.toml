[package]
name = "kiseki-gateway"
description = "Protocol gateways for Kiseki: NFS and S3 protocol translation layers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate; only kiseki-client publishes (release.yml)

[lints]
workspace = true

[features]
default = ["nfs", "s3", "native"]
nfs = []
s3 = []
# Native gRPC GatewayDataService (ADR-042). Optional so embedded
# gateway-only consumers (FUSE shim, NFS-only deployments) don't pay
# the tonic / kiseki-proto compile cost.
native = [
    "dep:kiseki-proto",
    "dep:tonic",
    "dep:prost",
    "dep:postcard",
    "dep:tokio-stream",
    "dep:x509-parser",
]

[dependencies]
async-trait = { workspace = true }
kiseki-advisory = { workspace = true }
kiseki-common = { workspace = true }
kiseki-log = { workspace = true }
kiseki-chunk = { workspace = true }
kiseki-chunk-cluster = { workspace = true }
kiseki-composition = { workspace = true }
kiseki-control = { workspace = true }
kiseki-crypto = { workspace = true }
kiseki-proto = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
tokio-stream = { version = "0.1", optional = true }
x509-parser = { workspace = true, optional = true }
aws-lc-rs = { workspace = true }
axum = "0.8"
kiseki-audit = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "service"] }
kiseki-transport = { workspace = true }
kiseki-view = { workspace = true }
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
httpdate = "1"
prometheus = { workspace = true }
parking_lot = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = "0.26"
tower = "0.5"
# ADR-042 §2.2 TCP-framed binding listener: per-peer connection map
# + hot-rotatable TLS acceptor mirror the kiseki-raft tcp_transport
# listener pattern.
arc-swap = "1.7"
dashmap = "6"
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
axum = { version = "0.8", features = ["tokio"] }
http-body-util = "0.1"
proptest = { workspace = true }
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid = { workspace = true }
