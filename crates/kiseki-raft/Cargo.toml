[package]
name = "kiseki-raft"
description = "Shared Raft type configuration and network transport for Kiseki."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kiseki-common = { workspace = true }
arc-swap = "1.7"
async-trait = { workspace = true }
dashmap = "6"
futures = "0.3"
openraft = { workspace = true }
prometheus = { workspace = true }
# Persistent Raft log store (ADR-022 rev-2 successor): fjall replaces
# redb 2026-05-06 alongside the composition path swap. The Raft log
# is append-mostly + truncate-back-on-leader-change + range-scan on
# replay; redb's per-write COW B-tree commit dominated CPU at the
# rates the multi-shard fabric drives. fjall's LSM batches the
# WAL append + memtable insert into one journal write per
# `WriteBatch`, matching the durability contract openraft expects.
fjall = "3.1"
serde = { version = "1", features = ["derive"] }
thiserror = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
