[package]
name = "kiseki-raft"
description = "Shared Raft type configuration and network transport for Kiseki."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate; only kiseki-client publishes (release.yml)

[lints]
workspace = true

[dependencies]
kiseki-common = { workspace = true }
arc-swap = "1.7"
async-trait = { workspace = true }
dashmap = "6"
futures = "0.3"
# In-memory LRU cache for FjallRaftLogStore (GH #199). Holds
# already-deserialized Entry<C> so the leader-side double-decode
# (read for replication + read for apply) doesn't pay postcard
# twice on hot recent entries.
lru = { workspace = true }
openraft = { workspace = true }
prometheus = { workspace = true }
# Persistent Raft log store (ADR-022 rev-2 successor): fjall replaces
# redb 2026-05-06 alongside the composition path swap. The Raft log
# is append-mostly + truncate-back-on-leader-change + range-scan on
# replay; redb's per-write COW B-tree commit dominated CPU at the
# rates the multi-shard fabric drives. fjall's LSM batches the
# WAL append + memtable insert into one journal write per
# `WriteBatch`, matching the durability contract openraft expects.
fjall = "3.1"
parking_lot = { workspace = true }
serde = { version = "1", features = ["derive"] }
# serde_bytes: skip postcard's per-byte SeqAccess loop on the
# wire-receive decode of inter-node Raft RPC payloads. The wire
# format (length-prefix + raw bytes) is identical to bare Vec<u8>;
# the win is purely in the deserializer (one visit_byte_buf vs
# N visit_u8 calls). Site: `decode_request_body` payload field.
serde_bytes = { workspace = true }
thiserror = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
