[package]
name = "kiseki-client"
description = "Native client for Kiseki: FUSE mount, fabric discovery, client-side encryption."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # source-distributed via GitHub releases — see release.yml comment block

[lints]
workspace = true

[lib]
# Both Rust consumers (rlib) and C/C++/Python wrappers (cdylib) link
# this crate. cdylib output is required for the FFI ABI link-verify
# test (ADV-PA-5).
crate-type = ["lib", "cdylib"]

[features]
default = []
ffi = []
fuse = ["dep:kiseki-fuse"]
python = ["pyo3"]
# Network attachment of FUSE/POSIX path to a running kiseki cluster.
# Adds a `RemoteHttpGateway` that implements `GatewayOps` against the
# kiseki-server S3 listener (port 9000). Off by default so the
# kiseki-client crate doesn't pull reqwest+rustls into the FFI/cdylib
# build path that downstream Python/C++ wrappers consume.
remote-http = ["reqwest", "async-trait"]
# NFSv4.1 client — connects to kiseki-server's NFS port (2049) and
# translates GatewayOps into NFSv4 COMPOUND RPCs over TCP. Uses
# XDR utilities from kiseki-gateway. ADR-023 D7.
remote-nfs = ["async-trait"]
# Native GatewayDataService client (ADR-042). Covers BOTH the gRPC
# binding (Phase 5) and the TCP-framed-postcard binding (§2.2).
# Bindings are always-compiled when the `native` feature is on;
# runtime selection picks per-edge per ADR-042 §3.2.
native = [
    "dep:kiseki-proto",
    "dep:tonic",
    "dep:dashmap",
    "dep:postcard",
    "dep:tokio-rustls",
    "dep:rustls",
    "async-trait",
]

[dependencies]
kiseki-common = { workspace = true }
kiseki-chunk = { workspace = true }
kiseki-composition = { workspace = true }
kiseki-crypto = { workspace = true }
kiseki-gateway = { workspace = true }
kiseki-proto = { workspace = true, optional = true }
# ADR-042 §3.2 client-side per-edge selector reuses
# kiseki-transport::native::OperatorPin for the
# `KISEKI_NATIVE_TRANSPORT` semantics — same pin shape applies to
# both server-side and client-side selection.
kiseki-transport = { workspace = true }
tonic = { workspace = true, optional = true }
dashmap = { version = "6", optional = true }
postcard = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
parking_lot = { workspace = true }
async-trait = { version = "0.1", optional = true }
kiseki-fuse = { workspace = true, optional = true }
libc = { workspace = true }
pyo3 = { version = "0.28", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "http2"], optional = true }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[[bin]]
name = "kiseki-client"
path = "src/bin/kiseki_client.rs"

[[test]]
name = "native_abi"
required-features = ["ffi"]

[[test]]
name = "c_abi_link"
required-features = ["ffi"]

[[test]]
name = "per_peer_cap_collision"
required-features = ["native"]

[[test]]
name = "fuse_sync_adjacent_ops"
required-features = ["fuse"]

[[test]]
name = "fuse_o_direct"
required-features = ["fuse"]

[dev-dependencies]
async-trait = "0.1"
kiseki-chunk-cluster = { workspace = true }
kiseki-proto = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
tokio-stream = "0.1"
tonic = { workspace = true }
