[package]
name = "kiseki-chunk-cluster"
description = "Cross-node chunk replication for Kiseki: ClusteredChunkStore wraps a local chunk store and fans fragments out to peer nodes via the ClusterChunkService gRPC fabric (Phase 16a)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate; only kiseki-client publishes (release.yml)

[lints]
workspace = true

[features]
default = []
# ADR-047 escalation — fine-grained per-step write-path timers.
# Propagates `kiseki-tracing/hot-path-trace`. OFF by default (zero
# runtime cost; macros expand to `()`).
hot-path-trace = ["kiseki-tracing/hot-path-trace"]

[dependencies]
async-trait = { workspace = true }
fjall = "3.1"
futures = "0.3"
kiseki-chunk = { workspace = true }
kiseki-common = { workspace = true }
kiseki-crypto = { workspace = true }
kiseki-log = { workspace = true }
kiseki-proto = { workspace = true }
# `hot_timer!` / `hot_span!` macros on the chunk write hot path
# (ADR-047 escalation). Heavy deps inside kiseki-tracing are
# feature-gated; OFF expansion is `()`.
kiseki-tracing = { workspace = true }
postcard = { workspace = true }
prometheus = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
uuid = { workspace = true }
