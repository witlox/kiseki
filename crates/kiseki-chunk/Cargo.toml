[package]
name = "kiseki-chunk"
description = "Chunk Storage for Kiseki: encrypted chunk write/read, dedup, affinity pools, GC, retention holds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate; only kiseki-client publishes (release.yml)

[lints]
workspace = true

[features]
default = []
# NVIDIA GPUDirect Storage via cuFile (requires CUDA toolkit + nvidia-gds).
gpu-cuda = ["libc"]
# AMD ROCm GPU-direct via HIP (requires ROCm toolkit).
gpu-rocm = ["libc"]
# ADR-047 escalation — propagation pass-through for the hot-path
# timers. kiseki-chunk itself isn't instrumented today (the cluster
# wrapper in kiseki-chunk-cluster carries the timers); the feature
# exists here so a single `cargo build -p kiseki-server
# --features hot-path-trace` toggles everything via the workspace
# graph. OFF by default.
hot-path-trace = ["kiseki-tracing/hot-path-trace"]

[dependencies]
async-trait = { workspace = true }
libc = { workspace = true, optional = true }
kiseki-block = { workspace = true }
kiseki-common = { workspace = true }
kiseki-crypto = { workspace = true }
# Propagation pass-through for the ADR-047 hot-path timers (see
# `hot-path-trace` feature above). Heavy deps inside kiseki-tracing
# are feature-gated; OFF expansion is `()`.
kiseki-tracing = { workspace = true }
parking_lot = { workspace = true }
serde = { version = "1", features = ["derive"] }
# `serde_json` retained for the small-object inline store + the
# rare-mutation pools.json file. Chunk + fragment meta moved off JSON
# 2026-05-06 (ADR-022 rev-4) — see `persistent/encoding.rs`.
serde_json = "1"
# DashMap on the pool cache: `pools.get(name)` is in the chunk
# write hot path (durability-strategy lookup per PUT). Sharded
# concurrent reads kill the previous `Mutex<HashMap>` contention
# without paying for an LSM on a 10-entry config table.
dashmap = "6"
# fjall WAL for chunk + fragment meta (ADR-022 rev-4). Replaces the
# `save_meta` / `save_frag_meta` JSON-rewrite-the-world calls that
# capped per-PUT cost at O(N) in store size. Same backend the
# composition store and the Raft log use (rev-2 / rev-3).
fjall = "3.1"
postcard = { workspace = true }
kiseki-keymanager = { workspace = true }
prometheus = { workspace = true }
# `redb` was retained for `SmallObjectStore` pre-rev-5; ADR-022
# rev-5 (#129 unblock) moved the inline path to fjall — see
# `small_object_store.rs`. fjall is already a workspace dep
# above so no new line is needed.
reed-solomon-erasure = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
