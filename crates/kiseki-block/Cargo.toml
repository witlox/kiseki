[package]
name = "kiseki-block"
description = "Raw block device I/O for Kiseki: DeviceBackend trait, bitmap allocator, extent management (ADR-029)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate; only kiseki-client publishes (release.yml)

[lints]
workspace = true

[features]
default = []
# io_uring-backed `DeviceBackend` impl (GH #39). Linux-only, kernel
# >= 5.6 required (5.11+ recommended for `IORING_FEAT_FAST_POLL`).
# Opt-in: default off so non-Linux builds and older kernels stay
# unaffected, and so the existing `FileBackedDevice` remains the
# tested default until the criterion bench in `benches/` clears the
# perf gate spelled out in the issue (>= 20% single-fsync write win
# at 4 KB on a real NVMe; no regression at 64 KB).
io_uring = ["dep:io-uring"]

[dependencies]
kiseki-common = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CRC32C with SSE4.2 / ARM CRC intrinsics — replaces the hand-rolled
# bit-by-bit loop that capped fabric write_chunk at ~470 MiB/s in
# release builds (2026-05-04 docker compose baseline). The 0.6 series
# auto-detects HW support at runtime and falls back to a fast software
# table on platforms without the intrinsic.
crc32c = "0.6"
prometheus = { workspace = true }
# Open flags (O_DIRECT) for the raw block-device backend; constants
# only, no `unsafe` (all I/O goes through positioned read/write on
# block-aligned offsets). Linux is the deployment target (ADR-024).
libc = { workspace = true }
# Raw io_uring bindings. The `tokio-uring` alternative replaces the
# whole runtime — `io-uring` keeps the workspace runtime-agnostic and
# can be driven from a tokio task via its own reactor inside
# `UringFileBackedDevice`. Gated behind the `io_uring` feature so
# non-Linux builds and the default Tier-1 unit suite stay unaffected.
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"
# `criterion` drives the `FileBackedDevice` vs `UringFileBackedDevice`
# perf gate in `benches/backend_compare.rs` (GH #39). Pinned to 0.5
# (current stable line) and built without its plotters dep to keep
# the bench compile cheap on dev boxes.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "backend_compare"
harness = false
